<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Smart Pothole Detection Dashboard</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
background:#1e293b;
font-family:Arial;
color:white;
margin:0;
}

header{
background:#0f172a;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{

background:#334155;

padding:15px;

border-radius:10px;

margin-bottom:20px;

}

#gallery{

display:flex;

flex-wrap:wrap;

gap:20px;

}

.imageCard{

background:#0f172a;

padding:10px;

border-radius:10px;

width:280px;

}

.imageCard img{

width:100%;

border-radius:10px;

}

#map{

height:500px;

border-radius:10px;

margin-top:20px;

}

.info{

margin-top:10px;

font-size:15px;

}

</style>

</head>

<body>

<header>

🚧 Smart Pothole Detection Dashboard

</header>

<div class="container">

<div class="card">

<h2>Total Potholes :
<span id="count">0</span>

</h2>

</div>

<div class="card">

<h2>Detected Images</h2>

<div id="gallery"></div>

</div>

<div class="card">

<h2>Vehicle & Pothole Location</h2>

<div id="map"></div>

</div>

</div>

<script>

let map;

let vehicleMarker;

let potholeMarkers=[];

let previousData="";

function initMap(lat,lon){

map=L.map("map").setView([lat,lon],18);

L.tileLayer(

'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

{

attribution:'© OpenStreetMap'

}

).addTo(map);

vehicleMarker=L.marker([lat,lon])

.addTo(map)

.bindPopup("🚗 Vehicle")

.openPopup();

}

async function loadData(){

try{

const res=await fetch("https://potholedetection-mqs9.onrender.com/data");

const data=await res.json();

if(data.length===0) return;

const current=JSON.stringify(data);

if(current===previousData)

return;

previousData=current;

let total=0;

data.forEach(d=>total+=d.count);

document.getElementById("count").innerHTML=total;

const gallery=document.getElementById("gallery");

gallery.innerHTML="";

if(!map){

initMap(data[data.length-1].lat,

data[data.length-1].lon);

}

vehicleMarker.setLatLng(

[data[data.length-1].lat,

data[data.length-1].lon]

);

map.setView(

[data[data.length-1].lat,

data[data.length-1].lon],18);

potholeMarkers.forEach(m=>map.removeLayer(m));

potholeMarkers=[];

data.forEach(d=>{

const card=document.createElement("div");

card.className="imageCard";

const img=document.createElement("img");

img.src="https://potholedetection-mqs9.onrender.com/"+d.image;

const txt=document.createElement("div");

txt.className="info";

txt.innerHTML=

"<b>Potholes :</b> "+d.count+

"<br><b>Latitude :</b> "+d.lat+

"<br><b>Longitude :</b> "+d.lon+

"<br><b>Width :</b> "+d.width+

"<br><b>Height :</b> "+d.height+

"<br><b>Severity :</b> "+(d.severity || "Unknown");

card.appendChild(img);

card.appendChild(txt);

gallery.appendChild(card);

if(d.potholes){

d.potholes.forEach(p=>{

let marker=L.circleMarker(

[p.lat,p.lon],

{

radius:10,

color:"red",

fillColor:"red",

fillOpacity:1

}

).addTo(map);

marker.bindPopup(

"<b>🚧 Pothole</b><br>"+

"Width : "+p.width+

"<br>Height : "+p.height

);

potholeMarkers.push(marker);

});

}

});

}

catch(err){

console.log(err);

}

}

window.onload=function(){

loadData();

/* Refresh every 10 seconds */
setInterval(loadData,10000);

}

</script>

</body>

</html>
